<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A.D. Moyer Signage Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #141414; --black-2: #0d0d0d; --charcoal: #232323;
    --red: #c1282d; --cream: #f5f2ec; --cream-dim: #a39c92;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: var(--black-2); font-family: 'Work Sans', sans-serif; color: var(--cream);
  }
  .display { font-family: 'Oswald', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  #stage { position: relative; width: 100vw; height: calc(100vh - 46px); overflow: hidden; }
  .scene { position: absolute; inset: 0; opacity: 0; transform: scale(1.04); transition: opacity 1.1s ease, transform 6s ease-out; }
  .scene.active { opacity: 1; transform: scale(1); }

  .grain::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.2) 0px, transparent 2px, transparent 40px, rgba(0,0,0,0.12) 42px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, transparent 3px, transparent 90px);
    mix-blend-mode: overlay; opacity: 0.5;
  }

  .ribbon {
    display: inline-flex; align-items: center; background: var(--red); color: var(--cream);
    font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    clip-path: polygon(0% 0%, 92% 0%, 100% 50%, 92% 100%, 0% 100%);
    padding: 0.55vw 1.6vw 0.55vw 1.1vw;
  }

  .scene-logo {
    background: radial-gradient(circle at 50% 42%, var(--charcoal) 0%, var(--black) 60%, var(--black-2) 100%);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
  }
  .logo-img { height: 34vh; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.6)); }
  .logo-tag { margin-top: 2vw; font-size: 1.15vw; color: var(--cream-dim); letter-spacing: 0.15em; text-transform: uppercase; }
  .grit { position: absolute; inset: 0; pointer-events: none; }
  .grit span { position: absolute; width: 3px; height: 3px; background: rgba(245,242,236,0.3); border-radius: 50%; animation: drift linear infinite; }
  @keyframes drift { from { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } to { transform: translateY(-90vh) translateX(20px); opacity: 0; } }

  .scene-weather { display: grid; grid-template-columns: 1.1fr 1fr; background: linear-gradient(160deg, var(--charcoal), var(--black-2)); }
  .weather-left { display: flex; flex-direction: column; justify-content: center; padding: 0 5vw; }
  .eyebrow-txt { font-size: 1.1vw; letter-spacing: 0.3em; text-transform: uppercase; color: var(--red); font-weight: 600; margin-bottom: 1.2vw; }
  .big-time { font-size: 9vw; font-weight: 700; line-height: 1; color: var(--cream); }
  .big-date { margin-top: 1vw; font-size: 1.8vw; color: var(--cream-dim); }
  .weather-right { display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.25); border-left: 3px solid var(--red); padding: 0 3vw; text-align: center; }
  .weather-temp { font-size: 7vw; font-weight: 700; }
  .weather-desc { font-size: 1.6vw; color: var(--cream-dim); margin-top: 0.5vw; }
  .weather-hilo { margin-top: 1.4vw; font-size: 1.3vw; color: var(--red); letter-spacing: 0.05em; font-weight: 600; }

  .scene-promo { background: var(--black-2); display: grid; grid-template-columns: 1fr 1fr; }
  .promo-image { position: relative; overflow: hidden; }
  .promo-image img, .promo-image video { width: 100%; height: 100%; object-fit: cover; }
  .promo-image img { animation: kenburns 14s ease-in-out infinite alternate; }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.12); } }
  .promo-info { display: flex; flex-direction: column; justify-content: center; padding: 0 4.5vw; background: linear-gradient(160deg, var(--black), var(--black-2)); }
  .promo-info .ribbon { font-size: 1vw; margin-bottom: 1.6vw; width: fit-content; }
  .promo-title { font-size: 4vw; font-weight: 700; line-height: 1.05; }
  .promo-subtitle { font-size: 1.4vw; color: var(--cream-dim); margin-top: 1.2vw; max-width: 90%; }
  .price-tag { margin-top: 2.4vw; display: inline-flex; align-items: baseline; gap: 0.6vw; width: fit-content; }
  .price-tag .amount { font-size: 4.5vw; font-weight: 700; color: var(--cream); }
  .price-tag .unit { font-size: 1.3vw; color: var(--red); font-weight: 600; }

  .scene-fullvideo { background: #000; display: flex; align-items: center; justify-content: center; }
  .scene-fullvideo video { width: 100%; height: 100%; object-fit: cover; }
  .video-bug { position: absolute; bottom: 26px; left: 26px; font-size: 0.95vw; }

  #ruler { position: absolute; bottom: 0; left: 0; right: 0; height: 46px; background: var(--black); display: flex; align-items: center; border-top: 2px solid var(--red); overflow: hidden; }
  #ruler-label { font-size: 0.85vw; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cream-dim); padding: 0 18px; white-space: nowrap; border-right: 1px solid rgba(255,255,255,0.08); }
  #ruler-ticks { position: relative; flex: 1; height: 100%; display: flex; align-items: center; }
  .tick { flex: 1; height: 14px; border-left: 1px solid rgba(245,242,236,0.16); }
  .tick.major { height: 22px; border-left: 1px solid rgba(245,242,236,0.3); }
  #ruler-fill { position: absolute; top: 0; left: 0; bottom: 0; width: 0%; background: linear-gradient(90deg, rgba(193,40,45,0.5), rgba(193,40,45,0.65)); box-shadow: 3px 0 8px rgba(255,90,95,0.7); transition: width linear; }
  #ruler-clock { padding: 0 18px; font-size: 1vw; color: var(--cream); border-left: 1px solid rgba(255,255,255,0.08); white-space: nowrap; }

  #conn-dot { position: absolute; top: 14px; right: 14px; width: 9px; height: 9px; border-radius: 50%; background: #3a3a3a; z-index: 50; transition: background 0.4s; }
  #conn-dot.ok { background: #2e8b3d; }
  #conn-dot.stale { background: var(--red); }
</style>
</head>
<body>

<div id="conn-dot" title="content sync status"></div>
<div id="stage"></div>

<div id="ruler">
  <div id="ruler-label" class="mono">NOW SHOWING · —</div>
  <div id="ruler-ticks"><div id="ruler-fill"></div></div>
  <div id="ruler-clock" class="mono">--:--</div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* =========================================================
   Point this at your own self-hosted Supabase project.
   The anon key is meant to be public — real access control
   lives in the database's row-level security policies.
   ========================================================= */
const SUPABASE_URL = 'https://supabase.erikmoyer.me';
const SUPABASE_ANON_KEY = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTc4NjE5MjU2MCwiZXhwIjo0OTQxODY2MTYwLCJyb2xlIjoiYW5vbiJ9.V75df9SFAf_23iLysAz3GhFnzD23qPLqjMXnTFePBK4';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  db: { schema: 'signage' }
});

const params = new URLSearchParams(location.search);
const STORE_ID = params.get('store') || 'gilbertsville';
const POLL_MS = 1000 * 60 * 2; // fallback poll, in case realtime disconnects

const FALLBACK_LOGO = "data:image/svg+xml;base64," + btoa(`
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200">
  <text x="200" y="110" font-family="Arial" font-size="42" font-weight="700" fill="#f5f2ec" text-anchor="middle">A.D. MOYER</text>
</svg>`);

let DATA = { logoImg: FALLBACK_LOGO, storeTag: "Loading…", latitude: 40.31, longitude: -75.63, items: [] };
let lastGoodFetch = 0;

async function loadContent() {
  try {
    const [{ data: settings, error: sErr }, { data: items, error: iErr }] = await Promise.all([
      supabase.from('signage_settings').select('*').eq('store_id', STORE_ID).maybeSingle(),
      supabase.from('signage_items').select('*').eq('store_id', STORE_ID).order('position', { ascending: true })
    ]);
    if (sErr || iErr) throw (sErr || iErr);
    DATA = {
      logoImg: settings?.logo_url || FALLBACK_LOGO,
      storeTag: settings?.tagline || '',
      latitude: settings?.latitude ?? DATA.latitude,
      longitude: settings?.longitude ?? DATA.longitude,
      items: items || []
    };
    lastGoodFetch = Date.now();
    document.getElementById('conn-dot').className = 'ok';
  } catch (e) {
    if (lastGoodFetch && Date.now() - lastGoodFetch > POLL_MS * 3) {
      document.getElementById('conn-dot').className = 'stale';
    }
  }
}

// Realtime: refetch immediately whenever content changes in the database
supabase.channel('signage-live')
  .on('postgres_changes', { event: '*', schema: 'signage', table: 'signage_items', filter: `store_id=eq.${STORE_ID}` }, loadContent)
  .on('postgres_changes', { event: '*', schema: 'signage', table: 'signage_settings', filter: `store_id=eq.${STORE_ID}` }, loadContent)
  .subscribe();

const stage = document.getElementById('stage');
const rulerFill = document.getElementById('ruler-fill');
const rulerLabel = document.getElementById('ruler-label');
const rulerClock = document.getElementById('ruler-clock');
const rulerTicks = document.getElementById('ruler-ticks');

for (let i = 0; i < 60; i++) {
  const t = document.createElement('div');
  t.className = 'tick' + (i % 5 === 0 ? ' major' : '');
  rulerTicks.appendChild(t);
}

function liveClock() {
  rulerClock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
liveClock();
setInterval(liveClock, 15000);

const weatherCodeMap = {
  0: "Clear sky", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast",
  45: "Fog", 48: "Freezing fog",
  51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
  61: "Light rain", 63: "Rain", 65: "Heavy rain",
  71: "Light snow", 73: "Snow", 75: "Heavy snow",
  80: "Rain showers", 81: "Rain showers", 82: "Violent showers",
  95: "Thunderstorm", 96: "Thunderstorm w/ hail", 99: "Severe thunderstorm"
};
let weatherCache = null;
async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${DATA.latitude}&longitude=${DATA.longitude}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto`;
    const res = await fetch(url);
    const data = await res.json();
    weatherCache = {
      temp: Math.round(data.current_weather.temperature),
      desc: weatherCodeMap[data.current_weather.weathercode] || "—",
      hi: Math.round(data.daily.temperature_2m_max[0]),
      lo: Math.round(data.daily.temperature_2m_min[0])
    };
  } catch (e) { /* keep last known cache */ }
}
setInterval(fetchWeather, 1000 * 60 * 15);

function grit(container, count) {
  const wrap = document.createElement('div');
  wrap.className = 'grit';
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.bottom = '-10px';
    s.style.animationDuration = (8 + Math.random() * 10) + 's';
    s.style.animationDelay = (Math.random() * 8) + 's';
    wrap.appendChild(s);
  }
  container.appendChild(wrap);
}

function renderLogo() {
  const el = document.createElement('div');
  el.className = 'scene scene-logo grain';
  el.innerHTML = `<img class="logo-img" src="${DATA.logoImg}" alt="A.D. Moyer Lumber"><div class="logo-tag">${DATA.storeTag}</div>`;
  grit(el, 24);
  return el;
}

function renderWeather() {
  const now = new Date();
  const el = document.createElement('div');
  el.className = 'scene scene-weather';
  const w = weatherCache;
  el.innerHTML = `
    <div class="weather-left">
      <div class="eyebrow-txt display">${now.toLocaleDateString([], { weekday: 'long' })}</div>
      <div class="big-time mono">${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
      <div class="big-date">${now.toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' })}</div>
    </div>
    <div class="weather-right">
      <div class="weather-temp mono">${w ? w.temp + '°' : '--°'}</div>
      <div class="weather-desc">${w ? w.desc : 'Loading…'}</div>
      <div class="weather-hilo mono">${w ? `H ${w.hi}° / L ${w.lo}°` : ''}</div>
    </div>
  `;
  return el;
}

function renderPromoItem(item) {
  const el = document.createElement('div');
  const isMedia = item.type === 'video' || item.type === 'youtube';

  if (isMedia && item.fullscreen) {
    el.className = 'scene scene-fullvideo';
    const mediaHtml = item.type === 'video'
      ? `<video src="${item.url}" autoplay muted loop playsinline></video>`
      : `<iframe src="https://www.youtube.com/embed/${item.url}?autoplay=1&mute=1&controls=0&loop=1&playlist=${item.url}&start=${item.start_seconds || 0}&modestbranding=1&rel=0" style="width:100%;height:100%;border:0;" allow="autoplay"></iframe>`;
    const bug = item.title || item.eyebrow
      ? `<div class="video-bug">${item.eyebrow ? item.eyebrow + ' · ' : ''}${item.title || ''}</div>` : '';
    el.innerHTML = mediaHtml + bug;
    return el;
  }

  el.className = 'scene scene-promo';
  const mediaHtml = item.type === 'video'
    ? `<video src="${item.url}" autoplay muted loop playsinline></video>`
    : item.type === 'youtube'
    ? `<iframe src="https://www.youtube.com/embed/${item.url}?autoplay=1&mute=1&controls=0&loop=1&playlist=${item.url}&start=${item.start_seconds || 0}&modestbranding=1&rel=0" style="width:100%;height:100%;border:0;" allow="autoplay"></iframe>`
    : `<img src="${item.url}" alt="">`;
  el.innerHTML = `
    <div class="promo-image">${mediaHtml}</div>
    <div class="promo-info">
      ${item.eyebrow ? `<div class="ribbon">${item.eyebrow}</div>` : ''}
      <div class="promo-title display">${item.title || ''}</div>
      <div class="promo-subtitle">${item.subtitle || ''}</div>
      ${item.price ? `<div class="price-tag mono"><span class="amount">${item.price}</span><span class="unit">${item.unit || ''}</span></div>` : ''}
    </div>
  `;
  return el;
}

const labels = { logo: "OUR STORY", weather: "TIME & WEATHER", item: "TODAY'S DEALS" };

let seqIndex = 0;
function buildSequence() {
  const items = DATA.items && DATA.items.length ? DATA.items : [{ type: 'logo' }];
  return items;
}

function playNext() {
  const seq = buildSequence();
  if (seqIndex >= seq.length) seqIndex = 0;
  const step = seq[seqIndex];
  seqIndex++;

  let el, type, duration;
  if (step.type === 'logo') {
    el = renderLogo(); type = 'logo'; duration = 10;
  } else if (step.type === 'weather') {
    el = renderWeather(); type = 'weather'; duration = 12;
  } else {
    if (!step.url) { playNext(); return; }
    el = renderPromoItem(step);
    type = 'item';
    duration = step.duration || (step.type === 'image' ? 11 : 20);
  }

  stage.appendChild(el);
  requestAnimationFrame(() => el.classList.add('active'));
  Array.from(stage.children).slice(0, -1).forEach(old => setTimeout(() => old.remove(), 1200));

  rulerLabel.textContent = "NOW SHOWING · " + labels[type];

  rulerFill.style.transition = 'none';
  rulerFill.style.width = '0%';
  rulerFill.offsetWidth; // force a reflow so the browser "locks in" 0% before re-enabling the transition
  rulerFill.style.transition = `width ${duration}s linear`;
  rulerFill.style.width = '100%';

  setTimeout(() => { playNext(); }, duration * 1000);
}

(async function init() {
  await loadContent();
  await fetchWeather();
  playNext();
  setInterval(loadContent, POLL_MS);
})();
</script>

</body>
</html>
